<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GymTracker AI</title>
    
    <!-- PWA Config -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GymTracker" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <script>
      // Polyfill for Node.js modules that expect process.env
      window.process = { env: {} };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#a855f7', // Purple-500
              primaryDark: '#7e22ce', // Purple-700
              secondary: '#2dd4bf', // Teal-400
              dark: '#0a0a0a', // Neutral-950
              card: '#171717', // Neutral-900
              surface: '#262626', // Neutral-800
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-dark text-neutral-100 antialiased selection:bg-primary selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker registered'))
            .catch(err => console.log('Service Worker registration failed (this is expected in some preview environments):', err));
        });
      }
    </script>
  </body>
</html>
